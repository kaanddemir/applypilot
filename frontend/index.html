<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>ApplyPilot</title>
<link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
<!-- Pre-paint theme: mirrors parseThemePreference()/resolveTheme() in src/theme.ts.
     Runs before the stylesheet so the first frame already has the right colors. -->
<script>
(function () {
  var stored = null;
  try { stored = localStorage.getItem("applypilot_theme"); } catch (e) {}
  var pref = stored === "light" || stored === "dark" ? stored : "system";
  var dark = pref === "dark" || (pref === "system" && !!window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.documentElement.dataset.themePreference = pref;
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<div class="app">
  <header class="topnav">
    <button class="brand" id="brandHome" type="button" aria-label="ApplyPilot board" title="Back to board">
      <img class="logo" src="assets/logo.png" alt="" aria-hidden="true" width="28" height="28" />
      <span class="brand-title">ApplyPilot</span>
    </button>
    <div class="topnav-actions">
      <button class="primary-btn" id="addAppBtn" type="button" aria-label="Add application">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span class="btn-label">Add application</span>
      </button>
      <div class="data-menu-wrap">
        <button class="icon-btn" id="appMenuBtn" type="button" aria-label="Menu" title="Menu">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
        </button>
        <div class="data-menu" id="appMenu" role="menu" aria-label="Menu" data-align="right">
          <button class="data-menu-item" id="profileBtn" type="button" role="menuitem">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5.5 21a7.5 7.5 0 0 1 13 0"/></svg>
            <span>Profile</span>
          </button>
          <div class="menu-sep" role="separator"></div>
          <div class="menu-label" id="themeMenuLabel">Theme</div>
          <div id="themeOptions" role="group" aria-labelledby="themeMenuLabel"></div>
        </div>
      </div>
    </div>
  </header>
  <main class="content" id="content" tabindex="-1"></main>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true" tabindex="-1"></div>
</div>
<div class="notification-center" id="notificationCenter" aria-label="Notifications"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
